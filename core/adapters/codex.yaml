# Codex host adapter manifest
# Spec: core/HOST-ADAPTER-SPEC.md v1.0

adapter_id: codex
spec_version: "1.0"
support_tier: first-class

# Session bootstrap chain
bootstrap_entry: .claude/BOOTSTRAP.md
adapter_instructions: AGENTS.md
onboarding_manual: MANUAL.md

# How canonical chiefs are exposed on this host
chief_exposure: mixed
chief_configs:
  - .codex/agents/jinu.toml
  - .codex/agents/nagi.toml
  - .codex/agents/koji.toml
parallel_agents: true  # native agent configs exist; host may delegate to them

# Tool wiring
mcp_config: .codex/config.toml
hooks_config: .codex/hooks.json
local_settings: .env  # gitignored; canonical secret store

# Codex discovers skills via symlink to shared library
skill_alias:
  path: .agents/skills
  target: .claude/skills

# MCP name mapping (skill references → this host)
mcp_mapping:
  mcp__chrome__*: mcp_servers.chrome
  mcp__notion__*: mcp_servers.notion
  mcp__playwright__*: mcp_servers.playwright
  mcp__figma__*: mcp_servers.figma
  mcp__reddit__*: mcp_servers.reddit

# Logical tools required by spec §6.1
logical_tools:
  notion: true
  chrome: true
  playwright: true
  figma: true
  reddit: true
  web_search: true  # host-native

setup_sh_aware: true
setup_jinu_trigger: true

known_limitations: []

conformance:
  last_reviewed: "2026-05-28"
  checklist_pass: full
